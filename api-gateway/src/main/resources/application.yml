server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Downstream services also set CORS headers; keep only the gateway's origin.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**,/ticket/**,/users/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/**
            # Must stay last: movie-service owns the remaining /api/** paths.
            - id: movie-service
              uri: lb://movie-service
              order: 100
              predicates:
                - Path=/api/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:3000
                  - http://localhost:3001
                  - http://localhost:3100
                allowed-methods: '*'
                allowed-headers: '*'

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
