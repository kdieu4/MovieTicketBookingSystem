services:
  # auth-service dùng chung Postgres trên Supabase (schema mtbs_auth) với user-service,
  # nên không còn database MySQL cục bộ ở đây.
  redis:
    image: redis:6.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB;FLUSHALL

volumes:
  redis_data:
