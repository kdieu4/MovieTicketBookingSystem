server:
  port: 8085

spring:
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  config:
    activate:
      profile: dev
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&currentSchema=mtbs_auth}
    username: ${DB_USERNAME:postgres.hwynoqfihdjjxhotmbie}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: mtbs_auth
        format_sql: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${server.port}

jwt:
  expiryHour: 24
  expiryDay: 14
  # Gia tri mac dinh chi dung cho dev; production phai set JWT_SECRET (cung gia tri cho movie-service).
  secretKey: ${JWT_SECRET:6A8h6Z5PrjWegTOVl3avQuKtzX23I1U9Y7X12ZW94lc=}
  refreshKey: DrF2Q9TpJhFjeDpCCFnJLH0hL6liQQahK1EK++wmYSA=
  resetKey: U2kSTGb1ahQjRut5rNdmh2tnari65Jo7DqVFIZQwPWo=

app:
  demo-ticket-enabled: true
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
    internal-api-key: ${USER_SERVICE_INTERNAL_API_KEY}