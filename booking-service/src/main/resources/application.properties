spring.application.name=booking-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.compression.enabled=true
server.compression.mime-typses=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Trong Docker, RabbitMQ nằm ở host `rabbitmq`; mặc định localhost chỉ đúng khi chạy dev.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Service ID, không phải địa chỉ cố định: LoadBalancer resolve qua Eureka.
user-service.base-url=http://user-service
movie-service.base-url=http://movie-service
user-service.internal-api-key=${USER_SERVICE_INTERNAL_API_KEY}
movie-service.internal-api-key=${MOVIE_SERVICE_INTERNAL_API_KEY:${USER_SERVICE_INTERNAL_API_KEY:dev-only-internal-key}}

# JWT do auth-service phat hanh. Gia tri mac dinh chi dung cho dev, production phai set JWT_SECRET.
jwt.secretKey=${JWT_SECRET:6A8h6Z5PrjWegTOVl3avQuKtzX23I1U9Y7X12ZW94lc=}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}                                

# Job chuyển booking PENDING đã quá hạn giữ chỗ sang EXPIRED
booking.expiry.scan-interval-ms=60000
booking.expiry.initial-delay-ms=20000
booking.expiry.batch-size=200

# TH8/Actuator: chi mo health + info, khong lo chi tiet noi bo ra ngoai.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
