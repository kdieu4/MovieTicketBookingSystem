spring.application.name=movie-service
# TH7: chạy instance thứ hai bằng SERVER_PORT, vẫn cùng Service ID trên Eureka.
server.port=${SERVER_PORT:8083}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# TMDB - diem va review phim. Token lay tu file movie-service/.env (da gitignore).
spring.config.import=optional:file:./.env[.properties]
tmdb.token=${TMDB_TOKEN:}
tmdb.language=vi-VN

# JWT do auth-service phat hanh. Gia tri mac dinh chi dung cho dev, production phai set JWT_SECRET.
jwt.secretKey=${JWT_SECRET:6A8h6Z5PrjWegTOVl3avQuKtzX23I1U9Y7X12ZW94lc=}

# Key cho API noi bo /api/internal/**. Production phai set MOVIE_SERVICE_INTERNAL_API_KEY.
app.internal-api-key=${MOVIE_SERVICE_INTERNAL_API_KEY:${USER_SERVICE_INTERNAL_API_KEY:dev-only-internal-key}}

# Job mở lại các ghế đang giữ nhưng đã quá hạn
seat.cleanup.scan-interval-ms=60000
seat.cleanup.initial-delay-ms=30000

# TH8/Actuator: chi mo health + info, khong lo chi tiet noi bo ra ngoai.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
