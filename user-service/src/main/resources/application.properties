spring.application.name=user-service
# ============================================================
#  MTBS - User Service
#  Issue #3 - feature/be-user-service
#
#  Pham vi tuan nay: CHUA dung Authentication, JWT va Role.
#  API hien co:
#    - GET    /api/users           (danh sach co phan trang)
#    - GET    /api/users/{id}      (chi tiet, Booking Service dung de kiem tra)
#    - PUT    /api/users/{id}      (cap nhat thong tin)
#    - DELETE /api/users/{id}      (xoa)
# ============================================================

# Bien cua moi truong nam trong file .env CUNG thu muc nay.
# DUONG DAN QUAN TRONG: duong dan ben phai la TUONG DOI so voi thu muc dang
# chay (working directory). Phai chay app tu user-service/ thi moi doc duoc
# .env. Chay tu thu muc khoc se khong co bien -> app bao loi truy cap MySQL bi
# tu cho. File .env da nam trong .gitignore nen khong bao gio len GitHub.
spring.config.import=optional:file:./.env[.properties]

# Port rieng cho User Service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

app.internal-api-key=${USER_SERVICE_INTERNAL_API_KEY:dev-only-internal-key}

# JWT do auth-service phat hanh. Gia tri mac dinh chi dung cho dev, production phai set JWT_SECRET.
jwt.secretKey=${JWT_SECRET:6A8h6Z5PrjWegTOVl3avQuKtzX23I1U9Y7X12ZW94lc=}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# TH8/Actuator: chi mo health + info, khong lo chi tiet noi bo ra ngoai.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
