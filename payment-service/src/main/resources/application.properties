spring.config.import=optional:file:.env[.properties]

spring.application.name=payment-service

server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

momo.partner-code=MOMO
momo.return-url=http://localhost:3000/
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/
momo.ipn-url=http://localhost:8000/api/momo/ipn-handler
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.request-type=captureWallet

vnpay.hash-secret=${VNP_HASH_SECRET}
vnpay.tmn-code=${VNP_TMN_CODE}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8084/api/v1/vnpay/return}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:3000/payment/return}
vnpay.version=2.1.0

vietqr.bank-id=${BANK_ID}
vietqr.account-no=${ACCOUNT_NO}
vietqr.account-name=${ACCOUNT_NAME}
vietqr.template=compact2

# Booking Service kiem tra chu so huu booking khi payment-service goi lai kem token.
booking-service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8082}

# JWT do auth-service phat hanh. Gia tri mac dinh chi dung cho dev, production phai set JWT_SECRET.
jwt.secretKey=${JWT_SECRET:6A8h6Z5PrjWegTOVl3avQuKtzX23I1U9Y7X12ZW94lc=}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Khong tra stack trace ra ngoai (tranh lo thong tin noi bo).
server.error.include-stacktrace=never
server.error.include-message=always

# TH8/Actuator: chi mo health + info, khong lo chi tiet noi bo ra ngoai.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
