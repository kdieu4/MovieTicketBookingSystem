$kind: http-request
name: "P-08 Tạo đơn chờ thanh toán thành công - 201"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{paidShowtimeId}},
      "seatIds": [{{paidSeatId}}],
      "sessionId": "{{paidSessionId}}",
      "requestId": "th8-paid-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["paidShowtimeId", "paidSeatId", "paidSessionId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy P-07 trước");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Tạo được đơn", () => pm.expect([200, 201]).to.include(pm.response.code));
      if (pm.response.code === 200 || pm.response.code === 201) {
        const body = pm.response.json();
        pm.test("Đơn ở trạng thái PENDING", () => pm.expect(body.status).to.eql("PENDING"));
        pm.test("Số tiền lấy từ Movie Service", () => pm.expect(Number(body.amount)).to.be.above(0));
        pm.collectionVariables.set("paidBookingId", String(body.bookingId));
        pm.collectionVariables.set("paidAmount", String(body.amount));
      }
    language: text/javascript
order: 11000
