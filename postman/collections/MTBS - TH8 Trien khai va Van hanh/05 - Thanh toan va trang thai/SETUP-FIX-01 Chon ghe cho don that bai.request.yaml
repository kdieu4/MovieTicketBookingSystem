$kind: http-request
name: "SETUP-FIX-01 Chọn suất chiếu và ghế trống cho đơn thất bại"
url: "{{baseUrl}}/api/getShowtimes"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      ["failShowtimeId", "failSeatId", "failSessionId"].forEach(function (k) { pm.collectionVariables.unset(k); });
      pm.collectionVariables.set("failSessionId", "th8-fail-" + Date.now() + "-" + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      const all = pm.response.json();
      pm.test("Đi qua Gateway tới được movie-service", () => pm.expect(Array.isArray(all)).to.be.true);

      const now = Date.now();
      const candidates = (Array.isArray(all) ? all : [])
        .filter(s => s.startTime && new Date(s.startTime).getTime() > now && s.status !== "CANCELLED")
        .sort((a, b) => new Date(a.startTime) - new Date(b.startTime))
        .slice(0, 10);

      let index = 0;

      function pickSeat(show, seats) {
        const free = (Array.isArray(seats) ? seats : []).find(x => !x.isSold && !x.heldByMe
          && (x.status === "AVAILABLE" || x.status === undefined)
          && (x.type === undefined || x.type === "NORMAL"));
        if (!free) return false;
        pm.collectionVariables.set("failShowtimeId", String(show.showtimeId));
        pm.collectionVariables.set("failSeatId", String(free.id ?? free.seatId));
        return true;
      }

      function tryNext() {
        if (index >= candidates.length) {
          pm.test("Tìm được suất chiếu còn ghế trống", () => pm.expect.fail("Cả 10 suất chiếu gần nhất đều hết ghế"));
          return;
        }
        const show = candidates[index++];
        const url = pm.variables.replaceIn("{{baseUrl}}/api/getSeatsByShowtime?showtimeId=") + show.showtimeId;
        pm.sendRequest({ url: url, method: "GET" }, function (err, res) {
          const seats = (!err && res && res.code === 200) ? res.json() : [];
          if (pickSeat(show, seats)) {
            pm.test("Tìm được suất chiếu còn ghế trống", () => pm.expect(true).to.be.true);
          } else {
            tryNext();
          }
        });
      }

      tryNext();
    language: text/javascript
order: 2000
