$kind: http-request
name: "P-05 Đơn chuyển PAYMENT_FAILED sau sự kiện - 200"
url: "{{baseUrl}}/api/bookings/{{failBookingId}}"
method: GET
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["failBookingId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy P-02 trước");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Đọc được đơn", () => pm.response.to.have.status(200));
      pm.test("Consumer cập nhật PAYMENT_FAILED", () => pm.expect(pm.response.json().status).to.eql("PAYMENT_FAILED"));
    language: text/javascript
order: 7000
