$kind: http-request
name: "P-07 Giữ ghế cho đơn thanh toán qua Gateway - 200"
url: "{{baseUrl}}/api/holdSeats?showtimeId={{paidShowtimeId}}"
queryParams:
  - key: "showtimeId"
    value: "{{paidShowtimeId}}"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "sessionId": "{{paidSessionId}}",
      "seatIds": [{{paidSeatId}}]
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["paidShowtimeId", "paidSeatId", "paidSessionId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy SETUP-FIX-02 trước");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Giữ ghế thành công", () => pm.response.to.have.status(200));
      pm.test("Có hạn giữ ghế", () => pm.expect(pm.response.json().holdUntil).to.be.a("string"));
    language: text/javascript
order: 10000
