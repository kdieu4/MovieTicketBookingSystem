$kind: http-request
name: "P-02 Tạo đơn chờ thanh toán trong Docker - 201"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{failShowtimeId}},
      "seatIds": [{{failSeatId}}],
      "sessionId": "{{failSessionId}}",
      "requestId": "th8-fail-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["failShowtimeId", "failSeatId", "failSessionId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy P-01 trước");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Tạo được đơn", () => pm.expect([200, 201]).to.include(pm.response.code));
      if (pm.response.code === 200 || pm.response.code === 201) {
        const body = pm.response.json();
        pm.test("Đơn ở trạng thái PENDING", () => pm.expect(body.status).to.eql("PENDING"));
        pm.test("Số tiền lấy từ Movie Service", () => pm.expect(Number(body.amount)).to.be.above(0));
        pm.collectionVariables.set("failBookingId", String(body.bookingId));
        pm.collectionVariables.set("failAmount", String(body.amount));
      }
    language: text/javascript
order: 4000
