$kind: http-request
name: "H-07 Auth Service - 200"
url: "{{authUrl}}/actuator/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Auth Service trả 200", () => pm.response.to.have.status(200));
      pm.test("Auth Service báo UP", () => pm.expect(pm.response.json().status).to.eql("UP"));
      pm.test("Không lộ chi tiết nội bộ", () => {
        pm.expect(pm.response.json()).to.not.have.property("components");
      });
    language: text/javascript
order: 7000
