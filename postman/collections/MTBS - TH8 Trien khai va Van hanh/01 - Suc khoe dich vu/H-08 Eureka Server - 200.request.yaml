$kind: http-request
name: "H-08 Eureka Server - 200"
url: "{{eurekaUrl}}/actuator/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Eureka Server trả 200", () => pm.response.to.have.status(200));
      pm.test("Eureka Server báo UP", () => pm.expect(pm.response.json().status).to.eql("UP"));
      pm.test("Không lộ chi tiết nội bộ", () => {
        pm.expect(pm.response.json()).to.not.have.property("components");
      });
    language: text/javascript
order: 8000
