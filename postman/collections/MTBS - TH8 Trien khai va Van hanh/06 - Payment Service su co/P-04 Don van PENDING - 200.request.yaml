$kind: http-request
name: "P-04 Đơn vẫn PENDING, không bị đánh dấu đã thanh toán - 200"
url: "{{baseUrl}}/api/bookings/{{downBookingId}}"
method: GET
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["downBookingId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy P-02 trước");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Đọc được đơn", () => pm.response.to.have.status(200));
      if (pm.variables.get("paymentDown") !== "true") {
        console.log("Bỏ qua P-04: P-03 chưa chạy trong tình huống payment-service bị dừng.");
        return;
      }
      const status = pm.response.json().status;
      pm.test("Đơn không được PAID khi chưa có xác nhận thanh toán", () => pm.expect(status).to.not.eql("PAID"));
      pm.test("Đơn giữ nguyên PENDING", () => pm.expect(status).to.eql("PENDING"));
    language: text/javascript
order: 6000
