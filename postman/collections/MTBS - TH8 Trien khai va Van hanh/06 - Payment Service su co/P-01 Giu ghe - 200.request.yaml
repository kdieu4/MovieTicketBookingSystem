$kind: http-request
name: "P-01 Giữ ghế qua Gateway - 200"
url: "{{baseUrl}}/api/holdSeats?showtimeId={{downShowtimeId}}"
queryParams:
  - key: "showtimeId"
    value: "{{downShowtimeId}}"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "sessionId": "{{downSessionId}}",
      "seatIds": [{{downSeatId}}]
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["downShowtimeId", "downSeatId", "downSessionId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Giữ ghế thành công", () => pm.response.to.have.status(200));
      pm.test("Có hạn giữ ghế", () => pm.expect(pm.response.json().holdUntil).to.be.a("string"));
    language: text/javascript
order: 3000
