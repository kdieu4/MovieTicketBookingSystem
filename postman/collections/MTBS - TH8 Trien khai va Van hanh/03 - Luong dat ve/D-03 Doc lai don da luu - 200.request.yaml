$kind: http-request
name: "D-03 Đọc lại đơn đã lưu trong database - 200"
url: "{{baseUrl}}/api/bookings/{{bookingId}}"
method: GET
headers:
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["bookingId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy D-02 trước trong cùng lượt");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Đọc lại được đơn vừa tạo", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Đơn đúng bản ghi đã lưu", () => pm.expect(String(body.bookingId)).to.eql(pm.variables.get("bookingId")));
      pm.test("Số tiền không đổi", () => pm.expect(Number(body.amount)).to.be.above(0));
    language: text/javascript
order: 5000
