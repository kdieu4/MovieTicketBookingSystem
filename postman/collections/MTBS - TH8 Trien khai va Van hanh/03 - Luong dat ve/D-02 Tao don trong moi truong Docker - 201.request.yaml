$kind: http-request
name: "D-02 Tạo đơn trong môi trường Docker - 201"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{showtimeId}},
      "seatIds": [{{seatId}}],
      "sessionId": "{{sessionId}}",
      "requestId": "th8-docker-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId", "sessionId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Booking Service gọi được User Service và Movie Service trong Docker network", () => {
        pm.expect([200, 201]).to.include(pm.response.code);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
        const body = pm.response.json();
        pm.test("Đơn ở trạng thái PENDING", () => pm.expect(body.status).to.eql("PENDING"));
        pm.test("Số tiền lấy từ Movie Service", () => pm.expect(Number(body.amount)).to.be.above(0));
        pm.test("Hạn giữ ghế lấy từ Movie Service", () => pm.expect(body.holdUntil).to.be.a("string").and.not.empty);
        if (body.bookingId) {
          pm.collectionVariables.set("bookingId", String(body.bookingId));
          pm.collectionVariables.set("bookingAmount", String(body.amount));
        }
      }
    language: text/javascript
order: 4000
