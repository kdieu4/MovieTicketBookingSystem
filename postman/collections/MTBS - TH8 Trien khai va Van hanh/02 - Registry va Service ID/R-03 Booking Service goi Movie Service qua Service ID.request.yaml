$kind: http-request
name: "R-03 Booking Service gọi Movie Service qua Service ID - 200"
url: "{{baseUrl}}/api/getShowtimes"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Đi qua Gateway tới được movie-service", () => pm.response.to.have.status(200));
      pm.test("Trả về danh sách suất chiếu", () => pm.expect(pm.response.json()).to.be.an("array"));
      // Lần gọi đầu sau khi dựng container có thể chậm vì JIT và cache Eureka,
      // nên ngưỡng chỉ dùng để phát hiện treo, không phải đo hiệu năng.
      pm.test("Provider phản hồi, không treo", () => {
        pm.expect(pm.response.responseTime).to.be.below(10000);
      });
    language: text/javascript
order: 3000
