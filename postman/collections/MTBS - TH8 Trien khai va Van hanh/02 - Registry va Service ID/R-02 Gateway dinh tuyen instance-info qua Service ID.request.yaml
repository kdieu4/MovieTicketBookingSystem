$kind: http-request
name: "R-02 Gateway tìm instance qua Service ID, không hardcode địa chỉ - 200"
url: "{{baseUrl}}/api/instance-info"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Gateway gọi được MOVIE-SERVICE qua Eureka", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Trả đúng thông tin instance", () => {
        pm.expect(body.serviceName).to.eql("MOVIE-SERVICE");
        pm.expect(body.port).to.be.a("number");
        pm.expect(body.instanceId).to.be.a("string").and.not.empty;
      });
      console.log("Instance xử lý request: " + body.instanceId);
    language: text/javascript
order: 2000
