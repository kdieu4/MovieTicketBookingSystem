$kind: http-request
name: "F-04 Dữ liệu còn nguyên sau khi restart container - 200"
url: "{{baseUrl}}/api/bookings/{{bookingId}}"
method: GET
headers:
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.variables.get("customerToken")) {
        throw new Error("Thiếu customerToken - chạy SETUP-01 ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const bookingId = pm.variables.get("bookingId");
      if (!bookingId) {
        console.log("Bỏ qua F-04: chưa có bookingId. Chạy folder 03 trước, restart container rồi chạy lại F-04.");
        return;
      }
      pm.test("Đơn đã lưu vẫn đọc được sau restart", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Đơn đúng bản ghi cũ", () => pm.expect(String(body.bookingId)).to.eql(String(bookingId)));
      pm.test("Số tiền không bị mất", () => pm.expect(Number(body.amount)).to.be.above(0));
    language: text/javascript
order: 6000
