$kind: http-request
name: "LB-01 Hai mươi request qua Gateway, ghi nhận instance xử lý - 200"
url: "{{baseUrl}}/api/instance-info"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code !== 200) {
        console.log("Bỏ qua LB-01: chưa có instance movie-service nào, mã " + pm.response.code
          + ". Khởi động ít nhất một instance rồi chạy lại.");
        return;
      }
      pm.test("Request đầu tiên thành công", () => pm.response.to.have.status(200));

      const ports = [];
      try { ports.push(pm.response.json().port); } catch (e) {}
      let sent = 1;

      function finish() {
        const tally = {};
        ports.forEach(function (p) { tally[p] = (tally[p] || 0) + 1; });
        const distinct = Object.keys(tally);
        pm.collectionVariables.set("instancePorts", distinct.join(","));

        pm.test("Cả 20 request đều thành công", () => pm.expect(ports.length).to.eql(20));
        console.log("Phân phối request theo instance: " + JSON.stringify(tally));

        const expected = Number(pm.collectionVariables.get("registryMovieInstances") || 0);
        if (expected >= 2) {
          pm.test("Request được phân phối tới cả hai instance", () => {
            pm.expect(distinct.length).to.be.at.least(2);
          });
        } else {
          console.log("Chỉ thấy " + distinct.length + " instance. Chạy R-01 khi đủ hai instance để kiểm phân phối.");
        }
      }

      function next() {
        if (sent >= 20) { finish(); return; }
        sent++;
        pm.sendRequest({
          url: pm.variables.replaceIn("{{baseUrl}}/api/instance-info"),
          method: "GET"
        }, function (err, res) {
          if (!err && res && res.code === 200) {
            try { ports.push(res.json().port); } catch (e) {}
          }
          next();
        });
      }

      next();
    language: text/javascript
order: 2000
