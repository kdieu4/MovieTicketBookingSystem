$kind: http-request
name: "P-06 Internal API xác nhận ghế khi có key - 200"
url: "{{movieBaseUrl}}/api/internal/showtimes/{{showtimeId}}/seat-claims"
method: POST
headers:
  "Content-Type": "application/json"
  "X-Internal-Api-Key": "{{internalApiKey}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": {{providerBookingId}},
      "sessionId": "{{sessionId}}",
      "seatIds": [{{seatId}}]
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId", "sessionId", "providerBookingId", "internalApiKey", "fixturePrice"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Xác nhận ghế thành công", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Provider tính đúng tiền theo giá suất chiếu", () => {
        pm.expect(Number(body.amount)).to.eql(Number(pm.variables.get("fixturePrice")));
      });
      pm.test("Trả về hạn giữ chỗ", () => pm.expect(body.holdUntil).to.be.a("string"));
    language: text/javascript
order: 7000
