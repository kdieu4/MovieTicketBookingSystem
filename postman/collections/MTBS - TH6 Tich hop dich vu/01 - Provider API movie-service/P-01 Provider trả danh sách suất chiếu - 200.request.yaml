$kind: http-request
name: "P-01 Provider trả danh sách suất chiếu - 200"
url: "{{movieBaseUrl}}/api/getShowtimes"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["movieBaseUrl"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Provider trả 200", () => pm.response.to.have.status(200));
      const list = pm.response.json();
      pm.test("Trả về mảng suất chiếu", () => pm.expect(Array.isArray(list)).to.be.true);
      pm.test("Mỗi suất chiếu có showtimeId, movieId, basePrice", () => {
        const first = list[0];
        pm.expect(first).to.have.property("showtimeId");
        pm.expect(first).to.have.property("movieId");
        pm.expect(first).to.have.property("basePrice");
      });
    language: text/javascript
order: 1000
