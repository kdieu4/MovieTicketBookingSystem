$kind: http-request
name: "P-07 Internal API nhả ghế khi có key - 204"
url: "{{movieBaseUrl}}/api/internal/showtimes/{{showtimeId}}/seat-claims/{{providerBookingId}}"
method: DELETE
headers:
  "Content-Type": "application/json"
  "X-Internal-Api-Key": "{{internalApiKey}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    [{{seatId}}]
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId", "providerBookingId", "internalApiKey"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Nhả ghế thành công", () => pm.expect([200, 204]).to.include(pm.response.code));
    language: text/javascript
order: 8000
