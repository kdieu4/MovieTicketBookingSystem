$kind: http-request
name: "P-04 Provider đánh dấu ghế đang bị giữ - 200"
url: "{{movieBaseUrl}}/api/getSeatsByShowtime?showtimeId={{showtimeId}}"
queryParams:
  - key: "showtimeId"
    value: "{{showtimeId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Provider trả 200", () => pm.response.to.have.status(200));
      const seats = pm.response.json();
      const seat = seats.find(x => String(x.id) === String(pm.variables.get("seatId")));
      pm.test("Ghế có hạn giữ chỗ", () => pm.expect(seat.holdUntil).to.be.a("string"));
      pm.test("Người khác thấy ghế không còn trống", () => pm.expect(seat.isSold).to.be.true);
      pm.test("Ghế đang bị giữ chứ chưa bán", () => pm.expect(seat.isSold && seat.holdUntil !== null).to.be.true);
    language: text/javascript
order: 5000
