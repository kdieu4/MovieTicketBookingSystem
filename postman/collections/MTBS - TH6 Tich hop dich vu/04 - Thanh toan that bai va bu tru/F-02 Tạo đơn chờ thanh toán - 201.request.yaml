$kind: http-request
name: "F-02 Tạo đơn chờ thanh toán - 201"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{showtimeId}},
      "seatIds": [{{seatId}}],
      "sessionId": "{{sessionId}}",
      "requestId": "th6-fail-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId", "sessionId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Tạo đơn thành công", () => pm.expect([200, 201]).to.include(pm.response.code));
      const body = pm.response.json();
      if (body.bookingId) pm.collectionVariables.set("failBookingId", String(body.bookingId));
      if (body.amount) pm.collectionVariables.set("failAmount", String(body.amount));
      pm.test("Đơn PENDING", () => pm.expect(body.status).to.eql("PENDING"));
    language: text/javascript
order: 4000
