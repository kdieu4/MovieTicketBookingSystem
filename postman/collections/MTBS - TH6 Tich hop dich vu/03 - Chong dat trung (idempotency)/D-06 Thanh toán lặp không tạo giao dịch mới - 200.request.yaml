$kind: http-request
name: "D-06 Thanh toán lặp không tạo giao dịch mới - 200"
url: "{{baseUrl}}/api/v1/payments/mock"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": {{idemBookingId}},
      "amount": {{bookingAmount}},
      "result": "FAILED"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["idemBookingId", "bookingAmount", "idemPaymentId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Vẫn trả 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Không tạo giao dịch mới", () => pm.expect(String(body.paymentId)).to.eql(pm.variables.get("idemPaymentId")));
      pm.test("Kết quả cũ được giữ nguyên", () => pm.expect(body.status).to.eql("SUCCESS"));
    language: text/javascript
order: 8000
