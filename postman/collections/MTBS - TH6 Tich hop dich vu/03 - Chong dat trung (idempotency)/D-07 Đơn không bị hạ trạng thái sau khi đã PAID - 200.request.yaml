$kind: http-request
name: "D-07 Đơn không bị hạ trạng thái sau khi đã PAID - 200"
url: "{{baseUrl}}/api/bookings/{{idemBookingId}}"
method: GET
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["idemBookingId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
      const until = Date.now() + 2000;
      while (Date.now() < until) {}
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Đọc được đơn", () => pm.response.to.have.status(200));
      pm.test("Đơn vẫn PAID", () => pm.expect(pm.response.json().status).to.eql("PAID"));
    language: text/javascript
order: 9000
