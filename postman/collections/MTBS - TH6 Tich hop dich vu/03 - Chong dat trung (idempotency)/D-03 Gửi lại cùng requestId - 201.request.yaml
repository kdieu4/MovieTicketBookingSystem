$kind: http-request
name: "D-03 Gửi lại cùng requestId - 201"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{showtimeId}},
      "seatIds": [{{seatId}}],
      "sessionId": "{{sessionId}}",
      "requestId": "{{idemRequestId}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId", "sessionId", "customerToken", "idemRequestId", "idemBookingId"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Lần lặp vẫn trả thành công", () => pm.expect([200, 201]).to.include(pm.response.code));
      const body = pm.response.json();
      pm.test("Không tạo đơn mới", () => pm.expect(String(body.bookingId)).to.eql(pm.variables.get("idemBookingId")));
      pm.test("Không nhân đôi số ghế", () => pm.expect(body.seatIds.length).to.eql(1));
    language: text/javascript
order: 5000
