$kind: http-request
name: "D-05 Thanh toán đơn idempotency - 200"
url: "{{baseUrl}}/api/v1/payments/mock"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": {{idemBookingId}},
      "amount": {{bookingAmount}},
      "result": "SUCCESS"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["idemBookingId", "bookingAmount", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Thanh toán thành công", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      if (body.paymentId) pm.collectionVariables.set("idemPaymentId", String(body.paymentId));
      pm.test("Giao dịch SUCCESS", () => pm.expect(body.status).to.eql("SUCCESS"));
    language: text/javascript
order: 7000
