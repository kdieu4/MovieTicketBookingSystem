$kind: http-request
name: "D-04 Gửi lặp lần ba vẫn cùng một đơn - 201"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{showtimeId}},
      "seatIds": [{{seatId}}],
      "sessionId": "{{sessionId}}",
      "requestId": "{{idemRequestId}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId", "sessionId", "customerToken", "idemRequestId", "idemBookingId"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Lần lặp thứ ba thành công", () => pm.expect([200, 201]).to.include(pm.response.code));
      pm.test("Vẫn là đơn cũ", () => pm.expect(String(pm.response.json().bookingId)).to.eql(pm.variables.get("idemBookingId")));
    language: text/javascript
order: 6000
