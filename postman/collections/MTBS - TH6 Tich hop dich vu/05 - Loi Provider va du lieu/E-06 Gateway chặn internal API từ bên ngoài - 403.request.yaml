$kind: http-request
name: "E-06 Gateway chặn internal API từ bên ngoài - 403"
url: "{{baseUrl}}/api/internal/showtimes/5401/seat-claims"
method: POST
headers:
  "Content-Type": "application/json"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": 1,
      "sessionId": "th6-internal",
      "seatIds": [1]
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["baseUrl"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Không gọi được API nội bộ qua gateway", () => pm.expect([401, 403, 404]).to.include(pm.response.code));
    language: text/javascript
order: 7000
