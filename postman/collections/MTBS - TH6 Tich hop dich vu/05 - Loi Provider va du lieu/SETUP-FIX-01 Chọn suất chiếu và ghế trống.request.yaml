$kind: http-request
name: "SETUP-FIX-01 Chọn suất chiếu và ghế trống"
url: "{{movieBaseUrl}}/api/getShowtimes"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      ["showtimeId","seatId","holdUntil","sessionId","providerBookingId","bookingId","paymentId","idemBookingId","idemRequestId","failBookingId","seatBefore"].forEach(function (k) { pm.collectionVariables.unset(k); });
      pm.collectionVariables.set("sessionId", "th6-" + Date.now() + "-" + Math.floor(Math.random() * 100000));
      pm.collectionVariables.set("providerBookingId", String(900000 + Math.floor(Math.random() * 99999)));
      const required = ["movieBaseUrl"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const all = pm.response.json();
      pm.test("Provider trả về danh sách suất chiếu", () => pm.expect(Array.isArray(all)).to.be.true);

      const now = Date.now();
      const candidates = (Array.isArray(all) ? all : [])
        .filter(s => s.startTime && new Date(s.startTime).getTime() > now && s.status !== "CANCELLED")
        .sort((a, b) => new Date(a.startTime) - new Date(b.startTime))
        .slice(0, 10);

      let index = 0;

      function pickSeat(show, seats) {
        const free = (Array.isArray(seats) ? seats : []).find(x => !x.isSold && !x.heldByMe && (x.status === "AVAILABLE" || x.status === undefined));
        if (!free) return false;
        pm.collectionVariables.set("showtimeId", String(show.showtimeId));
        pm.collectionVariables.set("seatId", String(free.id ?? free.seatId));
        pm.collectionVariables.set("fixturePrice", String(show.basePrice));
        return true;
      }

      function tryNext() {
        if (index >= candidates.length) {
          pm.test("Tìm được suất chiếu còn ghế trống", () => pm.expect.fail("Cả 10 suất chiếu gần nhất đều hết ghế"));
          return;
        }
        const show = candidates[index++];
        const url = pm.variables.replaceIn("{{movieBaseUrl}}/api/getSeatsByShowtime?showtimeId=") + show.showtimeId;
        pm.sendRequest({ url: url, method: "GET" }, function (err, res) {
          const seats = (!err && res && res.code === 200) ? res.json() : [];
          if (pickSeat(show, seats)) {
            pm.test("Tìm được suất chiếu còn ghế trống", () => pm.expect(true).to.be.true);
          } else {
            tryNext();
          }
        });
      }

      tryNext();
    language: text/javascript
order: 1500
