$kind: http-request
name: "E-01 Suất chiếu không tồn tại - 404"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": 99999999,
      "seatIds": [1],
      "sessionId": "th6-no-showtime",
      "requestId": "th6-e1-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Provider báo không tìm thấy suất chiếu", () => pm.response.to.have.status(404));
      pm.test("Mã lỗi SHOWTIME_NOT_FOUND", () => pm.expect(pm.response.json().error).to.eql("SHOWTIME_NOT_FOUND"));
    language: text/javascript
order: 2000
