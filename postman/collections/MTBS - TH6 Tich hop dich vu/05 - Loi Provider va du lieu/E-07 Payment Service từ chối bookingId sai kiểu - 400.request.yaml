$kind: http-request
name: "E-07 Payment Service từ chối bookingId sai kiểu - 400"
url: "{{baseUrl}}/api/v1/payments/booking/abc"
method: GET
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Sai kiểu tham số bị từ chối", () => pm.response.to.have.status(400));
      pm.test("Không lộ stack trace", () => pm.expect(JSON.stringify(pm.response.json())).to.not.include("java."));
    language: text/javascript
order: 8000
