$kind: http-request
name: "E-04 Sai kiểu showtimeId - 400"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": "abc",
      "seatIds": [1],
      "sessionId": "th6-bad-type",
      "requestId": "th6-e4-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Sai kiểu dữ liệu bị từ chối", () => pm.response.to.have.status(400));
      pm.test("Không lộ stack trace", () => pm.expect(JSON.stringify(pm.response.json())).to.not.include("java."));
    language: text/javascript
order: 5000
