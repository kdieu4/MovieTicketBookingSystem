$kind: http-request
name: "E-02 Ghế không tồn tại hoặc đã bị đặt - 409"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{showtimeId}},
      "seatIds": [99999999],
      "sessionId": "th6-bad-seat",
      "requestId": "th6-e2-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["customerToken", "showtimeId"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Provider từ chối ghế không giữ được", () => pm.expect([400, 404, 409]).to.include(pm.response.code));
      pm.test("Có mã lỗi rõ ràng", () => pm.expect(pm.response.json()).to.have.property("error"));
    language: text/javascript
order: 3000
