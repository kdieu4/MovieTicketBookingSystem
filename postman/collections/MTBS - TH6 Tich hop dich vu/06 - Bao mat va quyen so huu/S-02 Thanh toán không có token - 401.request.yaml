$kind: http-request
name: "S-02 Thanh toán không có token - 401"
url: "{{baseUrl}}/api/v1/payments/mock"
method: POST
headers:
  "Content-Type": "application/json"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": 1,
      "amount": 1000,
      "result": "SUCCESS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Bắt buộc đăng nhập", () => pm.response.to.have.status(401));
    language: text/javascript
order: 5000
