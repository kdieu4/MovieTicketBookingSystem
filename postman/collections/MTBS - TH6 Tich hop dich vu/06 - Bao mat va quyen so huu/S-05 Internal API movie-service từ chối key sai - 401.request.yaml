$kind: http-request
name: "S-05 Internal API movie-service từ chối key sai - 401"
url: "{{movieBaseUrl}}/api/internal/showtimes/5401/seat-claims"
method: POST
headers:
  "Content-Type": "application/json"
  "X-Internal-Api-Key": "{{wrongInternalApiKey}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": 1,
      "sessionId": "th6-wrong-key",
      "seatIds": [1]
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["movieBaseUrl", "wrongInternalApiKey"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Key sai bị từ chối", () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
