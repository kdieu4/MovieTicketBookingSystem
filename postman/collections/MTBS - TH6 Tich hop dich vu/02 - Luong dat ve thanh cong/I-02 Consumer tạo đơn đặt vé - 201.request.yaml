$kind: http-request
name: "I-02 Consumer tạo đơn đặt vé - 201"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": {{showtimeId}},
      "seatIds": [{{seatId}}],
      "sessionId": "{{sessionId}}",
      "requestId": "th6-happy-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId", "sessionId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Tạo đơn thành công", () => pm.expect([200, 201]).to.include(pm.response.code));
      const body = pm.response.json();
      pm.test("Đơn ở trạng thái PENDING", () => pm.expect(body.status).to.eql("PENDING"));
      pm.test("Consumer lấy giá từ Provider", () => pm.expect(Number(body.amount)).to.be.above(0));
      pm.test("Có hạn giữ ghế do Provider trả về", () => pm.expect(body.holdUntil).to.be.a("string").and.not.empty);
      if (body.bookingId) pm.collectionVariables.set("bookingId", String(body.bookingId));
      if (body.amount) pm.collectionVariables.set("bookingAmount", String(body.amount));
    language: text/javascript
order: 5000
