$kind: http-request
name: "I-07 Ghế được đóng sau sự kiện booking.paid - 200"
url: "{{movieBaseUrl}}/api/getSeatsByShowtime?showtimeId={{showtimeId}}"
queryParams:
  - key: "showtimeId"
    value: "{{showtimeId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["showtimeId", "seatId"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Provider trả 200", () => pm.response.to.have.status(200));
      const seats = pm.response.json();
      const seat = seats.find(x => String(x.id) === String(pm.variables.get("seatId")));
      pm.test("Ghế đã bán (Provider đã nhận sự kiện)", () => pm.expect(seat.isSold).to.be.true);
      pm.test("Ghế không còn ở trạng thái giữ chỗ", () => pm.expect(seat.holdUntil).to.be.oneOf([null, undefined]));
    language: text/javascript
order: 10000
