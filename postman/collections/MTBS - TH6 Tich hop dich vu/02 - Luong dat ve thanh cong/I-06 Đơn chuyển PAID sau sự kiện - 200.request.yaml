$kind: http-request
name: "I-06 Đơn chuyển PAID sau sự kiện - 200"
url: "{{baseUrl}}/api/bookings/{{bookingId}}"
method: GET
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["bookingId", "customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy các bước SETUP ở đầu folder này");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Đọc được đơn", () => pm.response.to.have.status(200));
      pm.test("Consumer đã cập nhật PAID", () => pm.expect(pm.response.json().status).to.eql("PAID"));
    language: text/javascript
order: 9000
