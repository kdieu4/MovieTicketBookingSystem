$kind: http-request
name: AUTHZ-06 Invalid JWT -> 401
url: "{{ticketBaseUrl}}/ticket"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{invalidToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Expected HTTP 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
