$kind: http-request
url: "{{authBaseUrl}}/auth/register"
method: POST
body:
  type: json
  content: |-
    {
        "fullName": "aa",
        "email": "abc@gmail.com",
        "phoneNumber": "1234567890",
        "password": "Abc@12345",
        "confirmPassword": "Abc@12345"
    }
scripts:
