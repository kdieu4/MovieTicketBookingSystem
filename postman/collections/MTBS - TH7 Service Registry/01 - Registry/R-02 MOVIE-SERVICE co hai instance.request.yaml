$kind: http-request
name: "R-02 MOVIE-SERVICE có hai instance cùng Service ID"
url: "{{eurekaUrl}}/eureka/apps"
method: GET
headers:
  "Accept": "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Registry trả 200", () => pm.response.to.have.status(200));
      const apps = (pm.response.json().applications?.application) || [];
      const movie = apps.find(function (a) { return a.name === "MOVIE-SERVICE"; });
      pm.test("Có MOVIE-SERVICE", () => pm.expect(movie).to.be.an("object"));
      const instances = (movie && movie.instance) || [];
      const ports = instances.map(function (i) { return i.port && i.port.$; });
      pm.collectionVariables.set("registryMovieInstances", String(ports.length));
      pm.test("Hai instance đăng ký cùng Service ID", () => {
        pm.expect(ports.length).to.be.at.least(2);
        pm.expect(new Set(ports).size).to.eql(ports.length);
      });
      console.log("Instance MOVIE-SERVICE: " + ports.join(", "));
    language: text/javascript
order: 2000
