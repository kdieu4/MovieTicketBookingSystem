$kind: http-request
name: "R-01 Eureka liệt kê đủ các dịch vụ - 200"
url: "{{eurekaUrl}}/eureka/apps"
method: GET
headers:
  "Accept": "application/json"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const required = ["eurekaUrl"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - kiểm tra environment th7-local");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Registry trả 200", () => pm.response.to.have.status(200));
      const apps = (pm.response.json().applications?.application) || [];
      const names = apps.map(function (a) { return a.name; });
      ["MOVIE-SERVICE", "BOOKING-SERVICE", "USER-SERVICE", "PAYMENT-SERVICE", "AUTH-SERVICE", "API-GATEWAY"]
        .forEach(function (name) {
          pm.test("Registry có " + name, () => pm.expect(names).to.include(name));
        });
      console.log("Dịch vụ trên Eureka: " + names.join(", "));
    language: text/javascript
order: 1000
