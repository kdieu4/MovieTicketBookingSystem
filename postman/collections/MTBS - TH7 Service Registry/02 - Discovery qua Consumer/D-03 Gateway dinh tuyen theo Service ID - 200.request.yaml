$kind: http-request
name: "D-03 Gateway định tuyến theo Service ID - 200"
url: "{{baseUrl}}/api/instance-info"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Gateway tìm được MOVIE-SERVICE qua Eureka", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Trả đúng thông tin instance", () => {
        pm.expect(body.serviceName).to.eql("MOVIE-SERVICE");
        pm.expect(body.port).to.be.a("number");
        pm.expect(body.instanceId).to.be.a("string").and.not.empty;
      });
      console.log("Request do instance " + body.instanceId + " xử lý");
    language: text/javascript
order: 5000
