$kind: http-request
name: "T-01 Dừng một instance, Provider vẫn phục vụ - 200"
url: "{{baseUrl}}/api/instance-info"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      console.log("Chuẩn bị: dừng một trong hai instance movie-service (8083 hoặc 8093)");
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        pm.test("Instance còn lại vẫn phục vụ request", () => pm.response.to.have.status(200));
        pm.test("Request không bị treo", () => pm.expect(pm.response.responseTime).to.be.below(5000));
        console.log("Instance còn sống xử lý request: " + pm.response.json().instanceId);
      } else {
        console.log("Bỏ qua T-01: chưa dừng instance nào, hoặc đã dừng cả hai. Mã " + pm.response.code);
      }
    language: text/javascript
order: 2000
