$kind: http-request
name: "T-03 Khởi động lại Provider, đăng ký lại với Eureka"
url: "{{eurekaUrl}}/eureka/apps"
method: GET
headers:
  "Accept": "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Registry trả 200", () => pm.response.to.have.status(200));
      const apps = (pm.response.json().applications?.application) || [];
      const movie = apps.find(function (a) { return a.name === "MOVIE-SERVICE"; });
      if (movie) {
        const ports = ((movie.instance) || []).map(function (i) { return i.port && i.port.$; });
        pm.test("MOVIE-SERVICE đăng ký lại", () => pm.expect(ports.length).to.be.at.least(1));
        console.log("Instance đã đăng ký lại: " + ports.join(", "));
      } else {
        console.log("Bỏ qua T-03: MOVIE-SERVICE chưa đăng ký. Khởi động lại một instance rồi chạy lại.");
      }
    language: text/javascript
order: 4000
