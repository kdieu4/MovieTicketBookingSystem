$kind: http-request
name: "E-02 Consumer kiểm tra dữ liệu đầu vào - 400"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": 1,
      "seatIds": [],
      "sessionId": "kt2-empty-seats",
      "requestId": "kt2-e2-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy SETUP-01 trước");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Dữ liệu đầu vào không hợp lệ bị từ chối", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("Mã lỗi INVALID_REQUEST", () => pm.expect(body.error).to.eql("INVALID_REQUEST"));
      pm.test("Không lộ stack trace", () => pm.expect(JSON.stringify(body)).to.not.include("java."));
    language: text/javascript
order: 3000
