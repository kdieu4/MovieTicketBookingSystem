$kind: http-request
name: "E-03 Provider không khả dụng - 503 (chạy khi tắt movie-service)"
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  "Content-Type": "application/json"
  "Authorization": "Bearer {{customerToken}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "userId": 47,
      "showtimeId": 1,
      "seatIds": [1],
      "sessionId": "kt2-provider-down",
      "requestId": "kt2-e3-{{$timestamp}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const required = ["customerToken"];
      const missing = required.filter(function (k) { return !pm.variables.get(k); });
      if (missing.length) {
          throw new Error("Thiếu biến " + missing.join(", ") + " - chạy SETUP-01 trước");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code === 503) {
        pm.test("Provider không phản hồi thì Consumer trả 503", () => pm.response.to.have.status(503));
        pm.test("Mã lỗi SERVICE_UNAVAILABLE", () => pm.expect(pm.response.json().error).to.eql("SERVICE_UNAVAILABLE"));
        pm.test("Không lộ chi tiết kỹ thuật", () => {
          const text = JSON.stringify(pm.response.json());
          pm.expect(text).to.not.include("Connection refused");
          pm.expect(text).to.not.include("java.");
        });
      } else {
        console.log("Bỏ qua E-03: movie-service đang chạy, mã " + pm.response.code + ". Dừng movie-service rồi chạy lại request này.");
      }
    language: text/javascript
order: 4000
