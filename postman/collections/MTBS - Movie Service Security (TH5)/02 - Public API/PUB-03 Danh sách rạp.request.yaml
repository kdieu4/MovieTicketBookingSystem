$kind: http-request
name: PUB-03 Danh sách rạp -> 200
url: "{{baseUrl}}/api/getCinemas"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("API công khai trả 200 khi không token", () => pm.response.to.have.status(200));
      pm.test("Trả về danh sách rạp", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 3000
