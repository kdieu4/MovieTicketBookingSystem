$kind: http-request
name: FIX-01 Chọn suất chiếu tương lai
url: "{{baseUrl}}/api/getShowtimes"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP 200", () => pm.response.to.have.status(200));
      const showtimes = pm.response.json();
      pm.test("Trả về danh sách suất chiếu", () => pm.expect(Array.isArray(showtimes)).to.be.true);

      const now = Date.now();
      const next = (Array.isArray(showtimes) ? showtimes : [])
        .find(s => s.startTime && new Date(s.startTime).getTime() > now);
      pm.test("Tìm thấy suất chiếu trong tương lai", () => pm.expect(next).to.be.an("object"));

      if (next) {
        pm.collectionVariables.set("showtimeId", String(next.showtimeId));
        pm.collectionVariables.set("fixtureMovieId", String(next.movieId));
        pm.collectionVariables.set("fixtureRoomId", String(next.roomId));
        pm.collectionVariables.set("fixtureStart", next.startTime);
        pm.collectionVariables.set("fixtureEnd", next.endTime);
        pm.collectionVariables.set("fixturePrice", String(next.basePrice));
        pm.collectionVariables.set("fixtureStatus", next.status || "SCHEDULED");
      }
    language: text/javascript
order: 1000
