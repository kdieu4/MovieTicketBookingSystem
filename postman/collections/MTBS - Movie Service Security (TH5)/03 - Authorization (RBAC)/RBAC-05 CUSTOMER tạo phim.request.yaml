$kind: http-request
name: RBAC-05 CUSTOMER tạo phim -> 403
description: |-
  Quản lý danh mục phim chỉ dành cho ADMIN. CUSTOMER gọi createMovie phải bị chặn
  trước khi vào service (body rỗng vẫn 403, không phải 400).
url: "{{baseUrl}}/api/createMovie"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    code: pm.test("CUSTOMER không được tạo phim (403)", () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
