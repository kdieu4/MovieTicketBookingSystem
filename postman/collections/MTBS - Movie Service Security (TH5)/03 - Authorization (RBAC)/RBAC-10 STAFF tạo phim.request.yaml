$kind: http-request
name: RBAC-10 STAFF tạo phim -> 403
description: |-
  Ranh giới STAFF và ADMIN: STAFF quản lý suất chiếu nhưng không được quản lý
  danh mục phim. Body rỗng vẫn 403, chứng minh chặn ở tầng phân quyền.
url: "{{baseUrl}}/api/createMovie"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    code: pm.test("STAFF không được tạo phim (403)", () => pm.response.to.have.status(403));
    language: text/javascript
order: 10000
