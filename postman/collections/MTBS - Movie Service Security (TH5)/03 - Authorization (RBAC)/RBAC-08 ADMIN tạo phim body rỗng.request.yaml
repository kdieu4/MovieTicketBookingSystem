$kind: http-request
name: RBAC-08 ADMIN tạo phim body rỗng -> 400
description: |-
  400 thay vì 403 chứng minh ADMIN đã qua phân quyền và lỗi đến từ validation.
  Body rỗng nên không tạo dữ liệu.
url: "{{baseUrl}}/api/createMovie"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    code: pm.test("ADMIN qua phân quyền, body rỗng trả 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000
