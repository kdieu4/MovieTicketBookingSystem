$kind: http-request
name: OWN-02 Ghế hiển thị heldByMe cho session A
url: "{{baseUrl}}/api/getSeatsByShowtime?showtimeId={{showtimeId}}&sessionId={{ownerSessionA}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP 200", () => pm.response.to.have.status(200));
      const seats = pm.response.json();
      const seatId = pm.collectionVariables.get("seatId");
      const seat = (Array.isArray(seats) ? seats : []).find(s => String(s.id) === seatId);
      pm.test("Tìm thấy ghế vừa giữ", () => pm.expect(seat).to.be.an("object"));
      if (seat) {
        pm.test("Session A thấy ghế là của mình", () => pm.expect(seat.heldByMe).to.be.true);
      }
    language: text/javascript
order: 2000
