$kind: http-request
name: OWN-09 Giữ ghế suất chiếu không tồn tại -> 404
url: "{{baseUrl}}/api/holdSeats?showtimeId=99999999"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "sessionId": "th5-invalid-showtime",
      "seatIds": [{{seatId}}]
    }
scripts:
  - type: afterResponse
    code: pm.test("Suất chiếu không tồn tại trả 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 9000
