$kind: http-request
name: OWN-03 Session B thấy ghế đã bị giữ
url: "{{baseUrl}}/api/getSeatsByShowtime?showtimeId={{showtimeId}}&sessionId={{ownerSessionB}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP 200", () => pm.response.to.have.status(200));
      const seats = pm.response.json();
      const seatId = pm.collectionVariables.get("seatId");
      const seat = (Array.isArray(seats) ? seats : []).find(s => String(s.id) === seatId);
      if (seat) {
        pm.test("Session B không thấy ghế là của mình", () => pm.expect(seat.heldByMe).to.be.false);
        pm.test("Session B thấy ghế không còn trống", () => pm.expect(seat.isSold).to.be.true);
      }
    language: text/javascript
order: 3000
