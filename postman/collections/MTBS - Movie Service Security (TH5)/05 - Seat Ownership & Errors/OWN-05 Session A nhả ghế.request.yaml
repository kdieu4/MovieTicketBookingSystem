$kind: http-request
name: OWN-05 Session A nhả ghế -> 200
description: Dọn dẹp ghế đã giữ ở OWN-01 để không để lại dữ liệu HOLDING.
url: "{{baseUrl}}/api/releaseSeats?showtimeId={{showtimeId}}"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "sessionId": "{{ownerSessionA}}",
      "seatIds": [{{seatId}}]
    }
scripts:
  - type: afterResponse
    code: pm.test("Nhả ghế trả 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
