$kind: http-request
name: OWN-08 holdSeats sessionId trống -> 400
url: "{{baseUrl}}/api/holdSeats?showtimeId={{showtimeId}}"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "sessionId": "   ",
      "seatIds": [{{seatId}}]
    }
scripts:
  - type: afterResponse
    code: pm.test("sessionId trống phải trả 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000
