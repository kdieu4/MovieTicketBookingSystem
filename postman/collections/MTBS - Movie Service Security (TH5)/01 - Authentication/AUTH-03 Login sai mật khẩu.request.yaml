$kind: http-request
name: AUTH-03 Login sai mật khẩu -> 401
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "WrongPassword123!"
    }
scripts:
  - type: afterResponse
    code: pm.test("Sai mật khẩu phải trả 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
