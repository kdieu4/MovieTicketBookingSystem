$kind: http-request
name: AUTH-07 Token hết hạn -> 401
description: |-
  Collection variable `expiredToken` mặc định là JWT sai chữ ký để luôn bị từ chối.
  Muốn minh chứng đúng trường hợp hết hạn, thay `expiredToken` bằng access token
  thật đã quá `exp` (có thể lấy từ lần đăng nhập trước).
url: "{{baseUrl}}/api/createShowtime"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{expiredToken}}"
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    code: pm.test("Token hết hạn phải trả 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000
