$kind: http-request
name: AUTH-04 Login email không tồn tại -> 401
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "khong-ton-tai-th5@example.com",
      "password": "WrongPassword123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Email không tồn tại phải trả 401", () => pm.response.to.have.status(401));
      pm.test("Không tiết lộ tài khoản có tồn tại hay không", () => {
        const body = pm.response.text().toLowerCase();
        pm.expect(body).to.not.include("not found");
        pm.expect(body).to.not.include("không tồn tại");
        pm.expect(body).to.not.include("khong ton tai");
      });
    language: text/javascript
order: 4000
