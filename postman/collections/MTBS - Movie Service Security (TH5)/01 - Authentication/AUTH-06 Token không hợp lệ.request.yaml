$kind: http-request
name: AUTH-06 Token không hợp lệ -> 401
url: "{{baseUrl}}/api/createShowtime"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{invalidToken}}"
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    code: pm.test("Token không hợp lệ phải trả 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
