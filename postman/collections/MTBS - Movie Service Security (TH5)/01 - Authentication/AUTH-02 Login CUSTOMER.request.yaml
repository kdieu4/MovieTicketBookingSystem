$kind: http-request
name: AUTH-02 Login CUSTOMER
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}",
      "platform": "WEB"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.unset("customerToken");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Login CUSTOMER trả 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const data = pm.response.json().data ?? {};
        pm.test("Có accessToken", () => pm.expect(data.accessToken).to.be.a("string").and.not.empty);
        if (data.accessToken) pm.collectionVariables.set("customerToken", data.accessToken);
      }
    language: text/javascript
order: 2000
