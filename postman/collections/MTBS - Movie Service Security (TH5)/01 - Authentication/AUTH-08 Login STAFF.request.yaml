$kind: http-request
name: AUTH-08 Login STAFF
description: |-
  Tài khoản có role STAFF (bảng roles + user_has_role của auth-service).
  Nếu case này 401, kiểm tra lại role đã gán và đã đăng nhập lại chưa.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{staffEmail}}",
      "password": "{{staffPassword}}",
      "platform": "WEB"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.unset("staffToken");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Login STAFF trả 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const data = pm.response.json().data ?? {};
        pm.test("Có accessToken", () => pm.expect(data.accessToken).to.be.a("string").and.not.empty);
        if (data.accessToken) pm.collectionVariables.set("staffToken", data.accessToken);
      }
    language: text/javascript
order: 8000
