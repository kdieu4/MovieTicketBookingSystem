$kind: http-request
name: INT-03 Gọi thẳng sai key -> 401
url: "{{movieBaseUrl}}/api/internal/showtimes/{{showtimeId}}/seat-claims"
method: POST
headers:
  Content-Type: application/json
  X-Internal-Api-Key: "{{wrongInternalApiKey}}"
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": 999999,
      "sessionId": "probe",
      "seatIds": [99999999]
    }
scripts:
  - type: afterResponse
    code: pm.test("Sai X-Internal-Api-Key phải trả 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
