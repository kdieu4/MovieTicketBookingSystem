$kind: http-request
name: INT-02 Gọi thẳng movie-service không key -> 401
description: |-
  Bỏ qua gateway, gọi trực tiếp cổng 8083. Controller kiểm X-Internal-Api-Key nên
  vẫn bị chặn. Đây là bằng chứng "gateway chặn" không phải lớp bảo vệ duy nhất.
url: "{{movieBaseUrl}}/api/internal/showtimes/{{showtimeId}}/seat-claims"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": 999999,
      "sessionId": "probe",
      "seatIds": [99999999]
    }
scripts:
  - type: afterResponse
    code: pm.test("Thiếu X-Internal-Api-Key phải trả 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
