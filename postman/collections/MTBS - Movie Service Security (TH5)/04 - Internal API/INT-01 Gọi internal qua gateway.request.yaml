$kind: http-request
name: INT-01 Gọi internal qua gateway -> 403
description: |-
  Gateway chặn mọi path /api/internal/ trước khi route xuống service
  (InternalPathBlockFilter). Client bên ngoài không bao giờ tới được API nội bộ.
url: "{{baseUrl}}/api/internal/showtimes/{{showtimeId}}/seat-claims"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "bookingId": 999999,
      "sessionId": "probe",
      "seatIds": [99999999]
    }
scripts:
  - type: afterResponse
    code: pm.test("Gateway chặn /api/internal/ (403)", () => pm.response.to.have.status(403));
    language: text/javascript
order: 1000
