$kind: http-request
name: INT-06 Release claim không key -> 401
description: Kiểm tra cả endpoint DELETE nội bộ, không chỉ POST.
url: "{{movieBaseUrl}}/api/internal/showtimes/{{showtimeId}}/seat-claims/999999"
method: DELETE
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    [99999999]
scripts:
  - type: afterResponse
    code: pm.test("Release claim thiếu key phải trả 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
