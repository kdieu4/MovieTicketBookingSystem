$kind: http-request
name: INT-04 Gọi thẳng bằng JWT CUSTOMER không key -> 401
description: |-
  Chứng minh JWT người dùng không thay thế được key nội bộ: có token hợp lệ vẫn 401.
url: "{{movieBaseUrl}}/api/internal/showtimes/{{showtimeId}}/seat-claims"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
body:
  type: json
  content: |-
    {
      "bookingId": 999999,
      "sessionId": "probe",
      "seatIds": [99999999]
    }
scripts:
  - type: afterResponse
    code: pm.test("JWT CUSTOMER không đủ quyền gọi API nội bộ (401)", () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
